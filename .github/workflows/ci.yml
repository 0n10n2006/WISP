name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libpipewire-0.3-dev libgbm-dev libxcb1-dev libxrandr-dev libegl-dev libdbus-1-dev clang xvfb dbus
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Launch self-test (Linux, headless)
        run: |
          cargo build -p wisp --features tauri/custom-protocol
          for run in 1 2; do
            WISP_SELFTEST_OUT=selftest-$run.json timeout 240 xvfb-run -a dbus-run-session -- ./target/debug/wisp --self-test || [ $run -eq 1 ]
          done
          cat selftest-2.json

  windows:
    name: Windows build (installer)
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - run: cargo test --workspace
      - run: npm run tauri build
      - name: Launch self-test (packaged app, UI scenario + real mouse)
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class Mouse {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, UIntPtr e);
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
          }
          "@
          [Mouse]::SetProcessDPIAware() | Out-Null
          # PRD §13 targets startup after first-run setup, so the first launch is a warm-up.
          foreach ($run in 1, 2) {
            $out = Join-Path $env:RUNNER_TEMP "selftest-$run.json"
            $notch = Join-Path $env:RUNNER_TEMP "selftest-$run.notch.json"
            $env:WISP_SELFTEST_OUT = $out
            # The second run also waits for a real hover and click on the notch.
            $env:WISP_SELFTEST_MOUSE = if ($run -eq 2) { "1" } else { "0" }
            $p = Start-Process -FilePath "target\release\wisp.exe" -ArgumentList "--self-test" -PassThru
            if ($run -eq 2) {
              $deadline = (Get-Date).AddSeconds(200)
              while (-not (Test-Path $notch) -and -not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
              if (Test-Path $notch) {
                $n = Get-Content $notch | ConvertFrom-Json
                Write-Host "Notch on screen at $($n.x),$($n.y) size $($n.width)x$($n.height), visible: $($n.visible)"
                $x = [int]($n.x + $n.width / 2); $y = [int]($n.y + [Math]::Max(2, $n.height / 2))
                [Mouse]::SetCursorPos($x - 60, $y + 80) | Out-Null; Start-Sleep -Milliseconds 300
                [Mouse]::SetCursorPos($x, $y) | Out-Null; Start-Sleep -Milliseconds 1500
                [Mouse]::mouse_event(0x02, 0, 0, 0, [UIntPtr]::Zero); Start-Sleep -Milliseconds 60
                [Mouse]::mouse_event(0x04, 0, 0, 0, [UIntPtr]::Zero)
              }
            }
            if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "Self-test run $run timed out" }
            if (Test-Path $out) { Get-Content $out } else { throw "Self-test run $run wrote no report" }
            if ($run -eq 2 -and $p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wisp-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
