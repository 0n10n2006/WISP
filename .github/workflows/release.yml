name: Release

# Push a tag like v0.2.0 (matching the version in tauri.conf.json, Cargo.toml and
# package.json) to build the Windows installers and create a draft GitHub release.
#
# The build runs with a read-only token and no caches (so nothing from an
# earlier run can end up in a release); only the small publish job can write.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - run: npm test
      - run: cargo test --workspace
      - run: npm run tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installers
          path: installers
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd installers && sha256sum $(find . -type f) > SHA256SUMS.txt)
          gh release create "$TAG" --draft --prerelease --title "Wisp $TAG" \
            --notes "Unsigned build. Windows SmartScreen may warn on first run (More info → Run anyway). Verify downloads against SHA256SUMS.txt. See README for setup and docs/TEST_PLAN.md for the smoke test." \
            $(find installers -type f)
