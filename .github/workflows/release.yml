name: Release

# Push a tag like v0.2.0 (matching the version in tauri.conf.json, Cargo.toml and
# package.json) to build the Windows installers and create a draft GitHub release.
#
# The build runs with a read-only token and no caches (so nothing from an
# earlier run can end up in a release); only the small publish job can write.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - run: npm test
      - run: cargo test --workspace
      - run: npm run tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: unsigned
        with:
          name: unsigned-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      # Signed through SignPath Foundation once configured (docs/SIGNING.md);
      # otherwise the release ships the unsigned installers.
      - name: Sign installers (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release
      - name: Use the unsigned installers
        if: env.SIGNPATH_ENABLED != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers
          path: release
          if-no-files-found: error
      - name: Note whether the build is signed
        shell: pwsh
        run: '"${{ env.SIGNPATH_ENABLED }}" | Out-File -Encoding ascii signed.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-flag
          path: signed.txt

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installers
          path: installers
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-flag
          path: flag
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd installers && sha256sum $(find . -type f) > SHA256SUMS.txt)
          if grep -q true flag/signed.txt; then
            NOTES="Signed build (SignPath Foundation). Verify downloads against SHA256SUMS.txt. See README for setup and docs/TEST_PLAN.md for the smoke test."
          else
            NOTES="Unsigned build. Windows SmartScreen may warn on first run (More info → Run anyway). Verify downloads against SHA256SUMS.txt. See README for setup and docs/TEST_PLAN.md for the smoke test."
          fi
          gh release create "$TAG" --draft --prerelease --title "Wisp $TAG" \
            --notes "$NOTES" \
            $(find installers -type f)
