[package]
name = "wisp"
description = "Wisp — a small AI companion for your desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "wisp"

[lib]
name = "wisp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.54.0", features = ["sync", "time", "macros", "rt"] }
whisper-rs = "0.16.0"
tokio-util = "0.7.20"
uuid = { version = "1.28.0", features = ["v4"] }
wisp-core = { path = "../crates/wisp-core" }
xcap = "0.9.8"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Shutdown", "Win32_System_Power", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Media_Control", "Devices_Radios", "Foundation", "Foundation_Collections", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_Devices_Display", "Win32_Devices_FunctionDiscovery", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Shell_PropertiesSystem", "Media_SpeechRecognition", "Globalization", "Win32_Security", "Win32_System_LibraryLoader", "Win32_UI_Input"] }
windows-core = "0.62.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3.27.0"
